version: '3.8'

services:
  # StaffSync MERN Application
  staffsync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staffsync-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/staffsync
      - JWT_SECRET=staffsync-production-docker-secret-2026
      - NODE_ENV=production
    depends_on:
      - mongo

  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: staffsync-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # MongoDB Web Admin Interface (Optional - view database in browser)
  mongo-express:
    image: mongo-express:latest
    container_name: staffsync-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo

volumes:
  mongo_data:
